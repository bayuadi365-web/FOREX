version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smc-radar-app
    ports:
      - "8000:8000"
      - "8080:8080" # For Reverb WebSocket
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=mariadb
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-smc_radar}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mariadb
      - redis
    networks:
      - smc-network

  mariadb:
    image: mariadb:11
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_DATABASE: ${DB_DATABASE:-smc_radar}
    volumes:
      - smc-mariadb-data:/var/lib/mysql
    networks:
      - smc-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - smc-redis-data:/data
    networks:
      - smc-network

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    image: smc-radar-app
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=mariadb
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-smc_radar}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mariadb
      - redis
    networks:
      - smc-network

networks:
  smc-network:
    driver: bridge

volumes:
  smc-mariadb-data:
  smc-redis-data:
